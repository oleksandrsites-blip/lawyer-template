<!doctype html>
<html lang="uk" data-style="light" data-font="onest">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Сторінку не знайдено</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { padding: 0; }
    .nf { min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    .nf__card { max-width: 560px; padding: 48px 32px; border-radius: 28px; text-align: center; background: linear-gradient(100deg, var(--card-a), var(--card-b)); }
    .nf__code { font-weight: 600; font-size: 120px; line-height: 1; letter-spacing: -.06em; background: linear-gradient(180deg, #fff 10%, rgba(255,255,255,.3)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .nf p { margin-top: 16px; color: var(--body); }
    .nf .btn { margin-top: 28px; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf__card">
      <div class="nf__code" aria-hidden="true">404</div>
      <h1 class="h2"><span class="h2__main">Сторінку не знайдено</span></h1>
      <p>Можливо, посилання застаріло. Поверніться на головну — там усі контакти.</p>
      <a class="btn btn--dark" href="/">На головну</a>
    </div>
  </main>
</body>
</html>
